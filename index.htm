    { v: 1, ar: "الر ۚ تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ", tafsir: "ئەم پیتانە لە «حروف مقطعە»ن. ئەمە ئایەتەکانی کتێبی دانایە — واتە قورئان." },
    { v: 3, ar: "إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۖ يُدَبِّرُ الْأَمْرَ", tafsir: "پەروەردگاری ئێوە خوای گەورەیە کە ئاسمان و زەوی لە شەش ڕۆژدا دروست کرد و دواتر لەسەر تەختی فەرمانڕەوایی دانیشت. کاروبارەکان بەڕێوەدەبات. هیچ شەفاعەتێک نییە جگە دوای ڕەزامەندی ئەو." },
    { v: 4, ar: "إِلَيْهِ مَرْجِعُكُمْ جَمِيعًا ۖ وَعْدَ اللَّهِ حَقًّا ۚ إِنَّهُ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ لِيَجْزِيَ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ بِالْقِسْطِ", tafsir: "بۆ لای ئەو گەڕانەوەی هەمووتانە — بەڵێنی خوای گەورەی ڕاستە. ئەو سەرەتا دروست دەکات و دووبارە زیندوو دەکاتەوە بۆ ئەوەی باوەڕدارانی چاککار بە دادپەروەری پاداش بدات." },
  ]},
];

const cleanArabic = (s) => s.replace(/[\u064B-\u0652\u0670\u0640]/g, "");

function App() {
  const [tab, setTab] = useState("names");
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(null);
  const [selectedSurah, setSelectedSurah] = useState(null);
  const [speakingId, setSpeakingId] = useState(null);

  const filteredNames = useMemo(() => {
    if (!query.trim()) return names;
    const q = query.trim().toLowerCase();
    return names.filter(n => n.ar.includes(query) || n.tr.toLowerCase().includes(q) || n.ku.includes(query) || String(n.n).includes(q));
  }, [query]);

  const filteredSurahs = useMemo(() => {
    if (!query.trim()) return surahs;
    return surahs.filter(s => s.name.includes(query) || s.nameKu.includes(query) || String(s.n).includes(query));
  }, [query]);

  useEffect(() => {
    return () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); };
  }, []);

  const speak = (text, id, lang = "ar-SA") => {
    if (!window.speechSynthesis) { alert("ببورە، وێبگەڕەکەت پشتگیری قسەکردن ناکات."); return; }
    window.speechSynthesis.cancel();
    if (speakingId === id) { setSpeakingId(null); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;
    utter.rate = 0.7;
    const voices = window.speechSynthesis.getVoices();
    const arVoice = voices.find(v => v.lang.startsWith("ar"));
    if (arVoice) utter.voice = arVoice;
    utter.onend = () => setSpeakingId(null);
    utter.onerror = () => setSpeakingId(null);
    setSpeakingId(id);
    window.speechSynthesis.speak(utter);
  };

  const stopSpeaking = () => { if (window.speechSynthesis) window.speechSynthesis.cancel(); setSpeakingId(null); };

  return (
    <div dir="rtl" className="app-bg">
      <div className="pattern-bg min-h-screen">
        <header className="max-w-5xl mx-auto px-6 pt-12 pb-6 text-center">
          <div className="flex justify-center mb-3">
            <div className="flex items-center gap-2 text-xs uppercase font-latin" style={{ color: "#8a7340", letterSpacing: "0.2em" }}>
              <span>القرآن الكريم</span><span>·</span><span>الأسماء الحسنى</span>
            </div>
          </div>
          <h1 className="font-arabic text-4xl md:text-5xl mb-2 glow-gold" style={{ color: "#1a3024", fontWeight: 700 }}>
            {tab === "names" ? "ناوە جوانەکانی خودا" : "تەفسیری قورئانی پیرۆز"}
          </h1>
          <p className="font-kurdish text-sm md:text-base ornament" style={{ color: "#5a4a2a" }}>
            {tab === "names" ? "٩٩ ناوی پیرۆز و ماناکانیان" : "ئایەتە هەڵبژێردراوەکان بە تەفسیری کوردی"}
          </p>
        </header>

        <div className="max-w-md mx-auto px-6 mb-6">
          <div className="flex p-1 rounded-full border" style={{ background: "rgba(255, 252, 244, 0.7)", borderColor: "rgba(184, 149, 74, 0.3)" }}>
            <button onClick={() => { setTab("names"); setSelectedSurah(null); setQuery(""); }}
              className="flex-1 py-2 rounded-full font-kurdish text-sm flex items-center justify-center gap-2"
              style={{ background: tab === "names" ? "linear-gradient(135deg, #1a3024, #2d4a36)" : "transparent", color: tab === "names" ? "#d4b876" : "#5a4a2a", transition: "all 0.3s" }}>
              <Sparkles size={14} /> ٩٩ ناو
            </button>
            <button onClick={() => { setTab("tafsir"); setSelected(null); setQuery(""); }}
              className="flex-1 py-2 rounded-full font-kurdish text-sm flex items-center justify-center gap-2"
              style={{ background: tab === "tafsir" ? "linear-gradient(135deg, #1a3024, #2d4a36)" : "transparent", color: tab === "tafsir" ? "#d4b876" : "#5a4a2a", transition: "all 0.3s" }}>
              <ScrollText size={14} /> تەفسیر
            </button>
          </div>
        </div>

        {!selectedSurah && (
          <div className="max-w-2xl mx-auto px-6 mb-8">
            <div className="flex items-center gap-3 px-5 py-3 rounded-full border" style={{ background: "rgba(255, 252, 244, 0.7)", borderColor: "rgba(184, 149, 74, 0.3)" }}>
              <Search size={18} style={{ color: "#8a7340" }} />
              <input value={query} onChange={(e) => setQuery(e.target.value)}
                placeholder={tab === "names" ? "گەڕان لە ناوەکان..." : "گەڕان لە سورەتەکان..."}
                className="flex-1 bg-transparent outline-none font-kurdish text-sm md:text-base" style={{ color: "#1a3024" }} />
              {query && <button onClick={() => setQuery("")}><XIcon size={16} style={{ color: "#8a7340" }} /></button>}
            </div>
          </div>
        )}

        <main className="max-w-6xl mx-auto px-4 md:px-6 pb-12">
          {tab === "names" && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredNames.map((name, i) => {
                const isSpeaking = speakingId === `card-${name.n}`;
                return (
                  <div key={name.n} className="card-hover fade-in relative p-5 rounded-2xl border"
                    style={{ background: "rgba(255, 252, 244, 0.6)", borderColor: "rgba(184, 149, 74, 0.25)", animationDelay: `${(i % 12) * 30}ms` }}>
                    <button onClick={() => setSelected(name)} className="w-full text-right">
                      <div className="flex items-start justify-between mb-3">
                        <span className="font-latin text-xs" style={{ color: "#8a7340", letterSpacing: "0.15em" }}>{String(name.n).padStart(2, "0")}</span>
                        <Sparkles size={12} style={{ color: "#b8954a", opacity: 0.6 }} />
                      </div>
                      <div className="font-arabic text-3xl md:text-4xl mb-2" style={{ color: "#1a3024", lineHeight: 1.4 }}>{name.ar}</div>
                      <div className="font-latin text-sm mb-3" style={{ color: "#8a7340" }}>{name.tr}</div>
                      <div className="font-kurdish text-sm pl-10" style={{ color: "#3a3020", fontWeight: 500, lineHeight: 1.7 }}>{name.ku}</div>
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); speak(cleanArabic(name.ar), `card-${name.n}`); }}
                      className={`absolute bottom-4 left-4 w-9 h-9 rounded-full flex items-center justify-center ${isSpeaking ? "speaking-pulse" : ""}`}
                      style={{ background: isSpeaking ? "linear-gradient(135deg, #1a3024, #2d4a36)" : "rgba(184, 149, 74, 0.15)", color: isSpeaking ? "#d4b876" : "#8a7340", transition: "all 0.3s" }}>
                      {isSpeaking ? <VolumeX size={14} /> : <Volume2 size={14} />}
                    </button>
                  </div>
                );
              })}
              {filteredNames.length === 0 && <div className="col-span-full text-center py-20 font-kurdish" style={{ color: "#5a4a2a" }}>هیچ ناوێک نەدۆزرایەوە</div>}
            </div>
          )}

          {tab === "tafsir" && !selectedSurah && (
            <div>
              <div className="text-center mb-8">
                <div className="inline-block px-4 py-2 rounded-full text-xs font-kurdish" style={{ background: "rgba(184, 149, 74, 0.15)", color: "#5a4a2a", border: "1px solid rgba(184, 149, 74, 0.3)" }}>
                  📖 ئایەتە هەڵبژێردراوەکانی قورئانی پیرۆز
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredSurahs.map((s, i) => (
                  <button key={s.n} onClick={() => setSelectedSurah(s)} className="card-hover fade-in p-6 rounded-2xl border text-right"
                    style={{ background: "rgba(255, 252, 244, 0.6)", borderColor: "rgba(184, 149, 74, 0.25)", animationDelay: `${i * 40}ms` }}>
                    <div className="flex items-start justify-between mb-3">
                      <span className="font-latin text-xs" style={{ color: "#8a7340", letterSpacing: "0.15em" }}>سورەتی {String(s.n).padStart(2, "0")}</span>
                      <ScrollText size={14} style={{ color: "#b8954a", opacity: 0.7 }} />
                    </div>
                    <div className="font-arabic text-3xl mb-2" style={{ color: "#1a3024" }}>{s.name}</div>
                    <div className="font-kurdish text-sm mb-3" style={{ color: "#5a4a2a" }}>{s.nameKu}</div>
                    <div className="text-xs font-kurdish" style={{ color: "#8a7340" }}>{s.verses.length} ئایەتی هەڵبژێردراو</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {tab === "tafsir" && selectedSurah && (
            <div className="fade-in">
              <button onClick={() => setSelectedSurah(null)} className="flex items-center gap-2 mb-6 text-sm font-kurdish px-4 py-2 rounded-full"
                style={{ background: "rgba(255, 252, 244, 0.6)", color: "#5a4a2a", border: "1px solid rgba(184, 149, 74, 0.25)" }}>
                <ChevronLeft size={14} style={{ transform: "scaleX(-1)" }} /> گەڕانەوە
              </button>
              <div className="text-center mb-8 p-6 rounded-2xl" style={{ background: "linear-gradient(180deg, #fdfaf0 0%, #f5efe1 100%)", border: "1px solid rgba(184, 149, 74, 0.3)" }}>
                <div className="font-latin text-xs mb-2" style={{ color: "#8a7340", letterSpacing: "0.2em" }}>سورەتی {selectedSurah.n}</div>
                <div className="font-arabic text-5xl mb-2 glow-gold" style={{ color: "#1a3024" }}>{selectedSurah.name}</div>
                <div className="font-kurdish text-base" style={{ color: "#5a4a2a" }}>{selectedSurah.nameKu}</div>
              </div>
              <div className="space-y-6">
                {selectedSurah.verses.map((verse, idx) => {
                  const verseId = `verse-${selectedSurah.n}-${verse.v}-${idx}`;
                  const isSpeak = speakingId === verseId;
                  return (
                    <div key={verseId} className="fade-in p-6 rounded-2xl border" style={{ background: "rgba(255, 252, 244, 0.7)", borderColor: "rgba(184, 149, 74, 0.25)", animationDelay: `${idx * 50}ms` }}>
                      <div className="flex items-center justify-between mb-4">
                        <div className="px-3 py-1 rounded-full font-latin text-xs" style={{ background: "rgba(184, 149, 74, 0.15)", color: "#5a4a2a" }}>ئایەتی {verse.v}</div>
                        {verse.title && <div className="font-kurdish text-xs font-bold" style={{ color: "#b8954a" }}>✦ {verse.title}</div>}
                      </div>
                      <div className="font-arabic text-2xl md:text-3xl mb-5 text-center" style={{ color: "#1a3024", lineHeight: 2 }}>{verse.ar}</div>
                      <div className="text-center mb-3 font-kurdish text-xs" style={{ color: "#8a7340", letterSpacing: "0.1em" }}>✦ تەفسیر و واتا ✦</div>
                      <p className="font-kurdish text-sm md:text-base" style={{ color: "#3a3020", lineHeight: 2 }}>{verse.tafsir}</p>
                      <div className="flex items-center gap-2 mt-5 pt-4 border-t" style={{ borderColor: "rgba(184, 149, 74, 0.2)" }}>
                        <button onClick={() => speak(cleanArabic(verse.ar), verseId)}
                          className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-kurdish ${isSpeak ? "speaking-pulse" : ""}`}
                          style={{ background: isSpeak ? "linear-gradient(135deg, #1a3024, #2d4a36)" : "rgba(184, 149, 74, 0.15)", color: isSpeak ? "#d4b876" : "#1a3024", transition: "all 0.3s" }}>
                          {isSpeak ? <VolumeX size={12} /> : <Volume2 size={12} />}
                          {isSpeak ? "وەستان" : "گوێگرتن"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </main>

        {selected && (
          <div className="fixed inset-0 z-40 flex items-center justify-center p-4" style={{ background: "rgba(20, 28, 22, 0.6)" }} onClick={() => { stopSpeaking(); setSelected(null); }}>
            <div className="relative max-w-lg w-full rounded-3xl p-8 fade-in" style={{ background: "linear-gradient(180deg, #fdfaf0 0%, #f5efe1 100%)", boxShadow: "0 25px 60px -15px rgba(20, 30, 20, 0.4)", border: "1px solid rgba(184, 149, 74, 0.3)" }} onClick={(e) => e.stopPropagation()}>
              <button onClick={() => { stopSpeaking(); setSelected(null); }} className="absolute top-4 left-4 p-2 rounded-full"><XIcon size={18} style={{ color: "#5a4a2a" }} /></button>
              <div className="text-center mb-6">
                <div className="font-latin text-xs mb-2" style={{ color: "#8a7340", letterSpacing: "0.2em" }}>ناوی ژمارە {selected.n}</div>
                <div className="font-arabic text-6xl mb-3 glow-gold" style={{ color: "#1a3024", fontWeight: 700 }}>{selected.ar}</div>
                <div className="font-latin text-base mb-4" style={{ color: "#8a7340" }}>{selected.tr}</div>
                <button onClick={() => speak(cleanArabic(selected.ar), `modal-${selected.n}`)}
                  className={`mx-auto w-14 h-14 rounded-full flex items-center justify-center ${speakingId === `modal-${selected.n}` ? "speaking-pulse" : ""}`}
                  style={{ background: speakingId === `modal-${selected.n}` ? "linear-gradient(135deg, #1a3024, #2d4a36)" : "rgba(184, 149, 74, 0.2)", color: speakingId === `modal-${selected.n}` ? "#d4b876" : "#1a3024", transition: "all 0.3s" }}>
                  {speakingId === `modal-${selected.n}` ? <VolumeX size={22} /> : <Volume2 size={22} />}
                </button>
                <p className="text-xs mt-2 font-kurdish" style={{ color: "#8a7340" }}>گوێ بگرە لە تەلەفز</p>
              </div>
              <div className="text-center mb-4 ornament font-kurdish" style={{ color: "#5a4a2a", fontSize: "0.9rem" }}>واتا</div>
              <p className="text-center font-kurdish mb-4 text-lg" style={{ color: "#1a3024", lineHeight: 1.9 }}>{selected.ku}</p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
